[package]
name = "tarkor-nucleo"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Lógica sin interfaz del instalador de Tarkor: detección de equipo, perfiles de IA, configuración, procesos y motor de IA."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.38"
sha2 = "0.10"
ureq = { version = "3", features = ["json", "platform-verifier"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
ruzstd = "0.8"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
