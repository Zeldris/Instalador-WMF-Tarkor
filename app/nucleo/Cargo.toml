[package]
name = "tarkor-nucleo"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Lógica sin interfaz del instalador de Tarkor: detección de equipo, perfiles de IA y configuración."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.38"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
