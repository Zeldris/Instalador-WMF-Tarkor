[package]
name = "tarkor"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Tarkor: envoltorio de escritorio (asistente de primer arranque y gestión de procesos)."
publish = false

[lib]
name = "tarkor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tarkor-nucleo = { path = "../nucleo" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
