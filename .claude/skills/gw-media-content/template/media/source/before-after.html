<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Before and after: two images side by side. Put both images in media/source/ and write their file names in
     the two src attributes (relative to this folder, e.g. before.png); an image that does not load makes the
     render fail. The images are cropped to fill their half (object-fit: cover); use screenshots of the same
     size. Fill every gap written between double braces. -->
<meta name="gw-size" content="1200x675">
<title>Before and after</title>
<style>
  :root {
    /* Palette: override these to match the project (brand colors, dark or light). Nothing else needs to change. */
    --background: #0f172a; --surface: #1e293b; --border: #334155;
    --text: #f1f5f9; --muted: #94a3b8; --accent: #38bdf8; --accent-text: #0f172a;
    --good: #4ade80; --bad: #f87171;
    --font: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", "Liberation Sans", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 675px; overflow: hidden; background: var(--background); color: var(--text); font-family: var(--font);
         padding: 36px 40px 28px; display: flex; flex-direction: column; }
  h1 { font-size: 34px; margin-bottom: 20px; }
  .pair { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; min-height: 0; }
  figure { position: relative; border: 2px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--surface); min-height: 0; }
  figure img { width: 100%; height: 100%; object-fit: cover; display: block; }
  figcaption { position: absolute; left: 14px; top: 14px; padding: 6px 16px; border-radius: 999px; font-size: 20px; font-weight: 700;
               background: var(--background); color: var(--text); border: 2px solid var(--border); }
  figure.after figcaption { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .footer { margin-top: 16px; font-size: 20px; color: var(--muted); }
</style>
</head>
<body>
  <h1>{{qué cambia}}</h1>
  <div class="pair">
    <figure><img src="{{before.png}}" alt=""><figcaption>{{Antes}}</figcaption></figure>
    <figure class="after"><img src="{{after.png}}" alt=""><figcaption>{{Después}}</figcaption></figure>
  </div>
  <div class="footer">{{una frase: la diferencia que se nota}}</div>
</body>
</html>
