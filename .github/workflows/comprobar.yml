# Linux y Windows: compilación, tests y lint del instalador. qa: los tests de las herramientas y los enlaces, y en un
# pull request el pre-commit de la rama base sobre sus commits (de la plantilla de galivelop-workflow v0.3.0, FLU-2),
# para que un PR no pueda debilitar la comprobación que lo revisa.
name: Comprobar

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev gcc-mingw-w64-x86-64
      - run: cargo fmt --all --check
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test -p tarkor-nucleo
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: El núcleo y la app compilan para Windows
        run: cargo check -p tarkor-nucleo -p tarkor --target x86_64-pc-windows-gnu --all-targets

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cargo test -p tarkor-nucleo

  qa:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tests de tools/qa y del banco
        run: |
          python3 -m unittest discover -s tools/qa/tests
          python3 -m unittest discover -s tools/banco
      - name: Tests de los scripts de las skills
        run: |
          python3 -m unittest discover -s .claude/skills/opt-ai/scripts
          python3 -m unittest discover -s .claude/skills/scout-updates/scripts
      - name: Enlaces de los documentos
        run: python3 .claude/gw/scripts/enlaces-md.py
      - name: Sin find(...)! en el asistente
        run: python3 tools/qa/sin-find-forzado.py
      - name: Pre-commit de la rama base sobre el pull request
        if: github.event_name == 'pull_request'
        run: |
          base="origin/$GITHUB_BASE_REF"
          if ! git cat-file -e "$base:.githooks/pre-commit" 2>/dev/null; then
            echo "la rama base aún no tiene .githooks/pre-commit; se salta"
            exit 0
          fi
          mkdir -p .gw-ci
          git show "$base:.githooks/pre-commit" > .gw-ci/pre-commit
          bash .gw-ci/pre-commit --rango "$(git merge-base "$base" HEAD)..HEAD"
